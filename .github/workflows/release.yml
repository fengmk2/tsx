name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  native:
    name: Native packages
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml

  release:
    name: Release
    needs: [test, native]
    if: github.repository == 'privatenumber/tsx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native and WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.native.outputs.native-artifact }}
          path: ${{ runner.temp }}/native-bindings

      - name: Release
        env:
          TSX_PREBUILT_NATIVE_DIR: ${{ runner.temp }}/native-bindings
          # Preserve maintainer attribution for releases and issue comments.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        # The native publish hook runs before @semantic-release/npm publishes tsx.
        run: pnpm exec semantic-release
